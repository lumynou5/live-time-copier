<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script type="module" src="index.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
  </style>
</head>
<body>
<form>
  <p>
    <label for="escape-colons" data-i18n="settings.escape-colons.label">
      Escape colons?
    </label>
    <input id="escape-colons" type="checkbox">
  </p>
  <p>
    <label for="pad-zero" data-i18n="settings.pad-zero.label">
      Pad zero?
    </label>
    <select id="pad-zero">
      <option value="noop" data-i18n="settings.pad-zero.noop">
        Keep original
      </option>
      <option value="keep-2d" data-i18n="settings.pad-zero.keep-2d">
        Pad each unit to 2 digits
      </option>
      <option value="hour-1d" data-i18n="settings.pad-zero.hour-1d">
        Always have hour
      </option>
      <option value="hour-2d" data-i18n="settings.pad-zero.hour-2d">
        Always have hour with 2 digits
      </option>
    </select>
  </p>
</form>
</body>
</html>
